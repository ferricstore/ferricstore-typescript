version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
    open-pull-requests-limit: 5
    groups:
      npm-development:
        dependency-type: development
      npm-runtime:
        dependency-type: production
    ignore:
      # Types must match the oldest supported Node in engines.node.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # TypeDoc 0.28 supports TypeScript up to 6.0; lift this when it accepts 7.
      - dependency-name: typescript
        versions: [">=7"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:15"
