name: release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  id-token: write

jobs:
  npm:
    name: publish npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run pack:dry-run
      - name: Configure npm token fallback
        run: |
          if [ -n "${NPM_TOKEN:-}" ]; then
            echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc
            echo "Using NPM_TOKEN secret for npm publish."
          else
            echo "::notice::NPM_TOKEN is not configured. Attempting npm trusted publishing via GitHub OIDC."
            echo "::notice::OIDC publish requires the package to already exist on npm with this workflow configured as a trusted publisher."
          fi
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      - run: npm publish --provenance --access public
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
