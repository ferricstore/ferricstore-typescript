name: release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  integration:
    name: live integration ${{ matrix.server }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - server: release-0.8.0
            image: ghcr.io/ferricstore/ferricstore:0.8.0@sha256:abc16a208a8b2dd4077245ea77992b99883e2753b45acde93eef0088a8996783
          - server: pinned-core
            image: ghcr.io/ferricstore/ferricstore:ci-72452814231f592aff051c22fdbe7114476e2879@sha256:d019f239de8c4465cf9f0d0ed070287caa51f75c3c292d5ba08918b773e4befd
    env:
      FERRICSTORE_IMAGE: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22.22.0
          cache: npm
      - run: npm ci
      - run: npm run test:integration:isolated
      - if: always()
        run: npm run integration:down

  npm:
    name: publish npm
    needs: integration
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run pack:dry-run
      - name: Configure npm token fallback
        run: |
          if [ -n "${NPM_TOKEN:-}" ]; then
            echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc
            echo "Using NPM_TOKEN secret for npm publish."
          else
            echo "::notice::NPM_TOKEN is not configured. Attempting npm trusted publishing via GitHub OIDC."
            echo "::notice::OIDC publish requires the package to already exist on npm with this workflow configured as a trusted publisher."
          fi
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      - run: npm publish --provenance --access public
  release:
    name: create GitHub release
    needs: npm
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3
        with:
          generate_release_notes: true
