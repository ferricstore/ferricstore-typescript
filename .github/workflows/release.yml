name: release

on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  integration:
    name: live integration ${{ matrix.server }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - server: release-0.11.4
            image: ghcr.io/ferricstore/ferricstore:0.11.4@sha256:ee49d39e3b15cd6298537a88818647e71bcfc7571921e88bcf3a201311c690fc
          - server: release-0.11.14
            image: quay.io/ferricstore/ferricstore:0.11.14@sha256:f7d29befefa15bce4b3755bf786cf7620c814f13bbd336c0d9955581b323b60e
          - server: pinned-core
            image: ghcr.io/ferricstore/ferricstore:ci-014997467189c292f7a15b7ca605d514adcd8df2@sha256:2dc91388959a308947e762081bc447feaa2a5f6846d56de9e05aca17ce2f57f7
    env:
      FERRICSTORE_IMAGE: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.22.0
          cache: npm
      - run: npm ci
      - run: npm run test:integration:isolated
      - name: Build SDK for throughput smoke
        if: ${{ matrix.server == 'release-0.11.14' }}
        run: npm run build
      - name: Start release server for throughput smoke
        if: ${{ matrix.server == 'release-0.11.14' }}
        run: npm run integration:up
      - name: Acknowledged response throughput smoke
        if: ${{ matrix.server == 'release-0.11.14' }}
        run: >-
          npm run bench:kv -- --command set --request-mode direct
          --requests 1000 --pipeline 1 --clients 4 --inflight-batches 8
          --value-bytes 32 --min-throughput 100
      - if: always()
        run: npm run integration:down

  authenticated-integration:
    name: authenticated query ACL integration
    permissions:
      contents: read
    runs-on: ubuntu-latest
    env:
      FERRICSTORE_IMAGE: quay.io/ferricstore/ferricstore:0.11.14@sha256:f7d29befefa15bce4b3755bf786cf7620c814f13bbd336c0d9955581b323b60e
      FERRICSTORE_AUTH_PASSWORD: ts-sdk-integration-secret
      FERRICSTORE_AUTH_URL: ferric://default:ts-sdk-integration-secret@127.0.0.1:6388
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.22.0
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run integration:up
      - run: node scripts/bootstrap-integration-auth.mjs
        env:
          FERRICSTORE_AUTH_BOOTSTRAP_URL: ferric://127.0.0.1:6388
      - run: npm run test:integration:deployment
      - if: always()
        run: npm run integration:down

  http-integration:
    name: authenticated TLS HTTP integration
    permissions:
      contents: read
    runs-on: ubuntu-latest
    env:
      FERRICSTORE_IMAGE: quay.io/ferricstore/ferricstore:0.11.14@sha256:f7d29befefa15bce4b3755bf786cf7620c814f13bbd336c0d9955581b323b60e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.22.0
          cache: npm
      - run: npm ci
      - run: npm run test:integration:http

  npm:
    name: publish npm
    needs: [integration, authenticated-integration, http-integration]
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Verify release tag and checkout
        run: |
          package_version="$(jq -r '.version' package.json)"
          expected_tag="v${package_version}"
          checkout_sha="$(git rev-parse HEAD)"
          if [ "${GITHUB_REF_NAME}" != "${expected_tag}" ]; then
            echo "Release tag ${GITHUB_REF_NAME} does not match package version ${package_version}."
            exit 1
          fi
          if [ "${checkout_sha}" != "${GITHUB_SHA}" ]; then
            echo "Checked-out release commit ${checkout_sha} does not match event commit ${GITHUB_SHA}."
            exit 1
          fi
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      - run: npx --yes npm@11.6.2 audit --audit-level=high
      - run: npm run check
      - run: npm run pack:dry-run
      - name: Configure npm token fallback
        run: |
          if [ -n "${NPM_TOKEN:-}" ]; then
            echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc
            echo "Using NPM_TOKEN secret for npm publish."
          else
            echo "::notice::NPM_TOKEN is not configured. Attempting npm trusted publishing via GitHub OIDC."
            echo "::notice::OIDC publish requires the package to already exist on npm with this workflow configured as a trusted publisher."
          fi
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish once or verify an immutable retry
        run: |
          package_name="$(jq -r '.name' package.json)"
          package_version="$(jq -r '.version' package.json)"
          pack_json="$(npm pack --json)"
          tarball="$(jq -r '.[0].filename' <<<"${pack_json}")"
          local_integrity="$(jq -r '.[0].integrity' <<<"${pack_json}")"

          set +e
          registry_output="$(npm view "${package_name}@${package_version}" dist.integrity --json 2>&1)"
          registry_status=$?
          set -e

          if [ "${registry_status}" -eq 0 ]; then
            registry_integrity="$(jq -r 'if type == "string" then . else empty end' <<<"${registry_output}")"
            if [ -z "${registry_integrity}" ] || [ "${registry_integrity}" != "${local_integrity}" ]; then
              echo "npm ${package_name}@${package_version} already exists with different package integrity."
              exit 1
            fi
            echo "npm ${package_name}@${package_version} is already published with matching integrity; skipping upload."
          elif grep -q "E404" <<<"${registry_output}"; then
            npm publish "${tarball}" --provenance --access public
          else
            echo "Unable to determine whether npm ${package_name}@${package_version} already exists."
            echo "${registry_output}"
            exit "${registry_status}"
          fi
  release:
    name: create GitHub release
    needs: npm
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          generate_release_notes: true
