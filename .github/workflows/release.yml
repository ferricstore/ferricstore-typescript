name: release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  integration:
    name: live integration ${{ matrix.server }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - server: release-0.11.2
            image: ghcr.io/ferricstore/ferricstore:0.11.2@sha256:90758c3a2d191659928a728c5fb5e5f61d0ee910583e263f3bad543e5055bff8
          - server: pinned-core
            image: ghcr.io/ferricstore/ferricstore:ci-1f26dd855d875c5ff811511848aa9aa6296373dd@sha256:b70605c7c9944937db11e337e2bc5882d4df8589d4afdc7892574fc91b4397e6
    env:
      FERRICSTORE_IMAGE: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22.22.0
          cache: npm
      - run: npm ci
      - run: npm run test:integration:isolated
      - name: Build SDK for throughput smoke
        if: ${{ matrix.server == 'release-0.11.2' }}
        run: npm run build
      - name: Start release server for throughput smoke
        if: ${{ matrix.server == 'release-0.11.2' }}
        run: npm run integration:up
      - name: Acknowledged response throughput smoke
        if: ${{ matrix.server == 'release-0.11.2' }}
        run: >-
          npm run bench:kv -- --command set --request-mode direct
          --requests 1000 --pipeline 1 --clients 4 --inflight-batches 8
          --value-bytes 32 --min-throughput 100
      - if: always()
        run: npm run integration:down

  authenticated-integration:
    name: authenticated query ACL integration
    permissions:
      contents: read
    runs-on: ubuntu-latest
    env:
      FERRICSTORE_IMAGE: ghcr.io/ferricstore/ferricstore:0.11.2@sha256:90758c3a2d191659928a728c5fb5e5f61d0ee910583e263f3bad543e5055bff8
      FERRICSTORE_AUTH_PASSWORD: ts-sdk-integration-secret
      FERRICSTORE_AUTH_URL: ferric://default:ts-sdk-integration-secret@127.0.0.1:6388
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22.22.0
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run integration:up
      - run: node scripts/bootstrap-integration-auth.mjs
        env:
          FERRICSTORE_AUTH_BOOTSTRAP_URL: ferric://127.0.0.1:6388
      - run: npm run test:integration:deployment
      - if: always()
        run: npm run integration:down

  npm:
    name: publish npm
    needs: [integration, authenticated-integration]
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      - run: npx --yes npm@11.6.2 audit --audit-level=high
      - run: npm run check
      - run: npm run pack:dry-run
      - name: Configure npm token fallback
        run: |
          if [ -n "${NPM_TOKEN:-}" ]; then
            echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc
            echo "Using NPM_TOKEN secret for npm publish."
          else
            echo "::notice::NPM_TOKEN is not configured. Attempting npm trusted publishing via GitHub OIDC."
            echo "::notice::OIDC publish requires the package to already exist on npm with this workflow configured as a trusted publisher."
          fi
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      - run: npm publish --provenance --access public
  release:
    name: create GitHub release
    needs: npm
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3
        with:
          generate_release_notes: true
