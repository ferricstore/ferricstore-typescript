name: release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  integration:
    name: live integration ${{ matrix.server }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - server: release-0.11.4
            image: ghcr.io/ferricstore/ferricstore:0.11.4@sha256:ee49d39e3b15cd6298537a88818647e71bcfc7571921e88bcf3a201311c690fc
          - server: release-0.11.11
            image: quay.io/ferricstore/ferricstore:0.11.11@sha256:d9f488539f0d6c1a513d2315e7a9c2947cc795b393f3774c9de8ba5e5b5c21b5
          - server: pinned-core
            image: ghcr.io/ferricstore/ferricstore:ci-014997467189c292f7a15b7ca605d514adcd8df2@sha256:2dc91388959a308947e762081bc447feaa2a5f6846d56de9e05aca17ce2f57f7
    env:
      FERRICSTORE_IMAGE: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22.22.0
          cache: npm
      - run: npm ci
      - run: npm run test:integration:isolated
      - name: Build SDK for throughput smoke
        if: ${{ matrix.server == 'release-0.11.11' }}
        run: npm run build
      - name: Start release server for throughput smoke
        if: ${{ matrix.server == 'release-0.11.11' }}
        run: npm run integration:up
      - name: Acknowledged response throughput smoke
        if: ${{ matrix.server == 'release-0.11.11' }}
        run: >-
          npm run bench:kv -- --command set --request-mode direct
          --requests 1000 --pipeline 1 --clients 4 --inflight-batches 8
          --value-bytes 32 --min-throughput 100
      - if: always()
        run: npm run integration:down

  authenticated-integration:
    name: authenticated query ACL integration
    permissions:
      contents: read
    runs-on: ubuntu-latest
    env:
      FERRICSTORE_IMAGE: quay.io/ferricstore/ferricstore:0.11.11@sha256:d9f488539f0d6c1a513d2315e7a9c2947cc795b393f3774c9de8ba5e5b5c21b5
      FERRICSTORE_AUTH_PASSWORD: ts-sdk-integration-secret
      FERRICSTORE_AUTH_URL: ferric://default:ts-sdk-integration-secret@127.0.0.1:6388
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22.22.0
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run integration:up
      - run: node scripts/bootstrap-integration-auth.mjs
        env:
          FERRICSTORE_AUTH_BOOTSTRAP_URL: ferric://127.0.0.1:6388
      - run: npm run test:integration:deployment
      - if: always()
        run: npm run integration:down

  http-integration:
    name: authenticated TLS HTTP integration
    permissions:
      contents: read
    runs-on: ubuntu-latest
    env:
      FERRICSTORE_IMAGE: quay.io/ferricstore/ferricstore:0.11.11@sha256:d9f488539f0d6c1a513d2315e7a9c2947cc795b393f3774c9de8ba5e5b5c21b5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22.22.0
          cache: npm
      - run: npm ci
      - run: npm run test:integration:http

  npm:
    name: publish npm
    needs: [integration, authenticated-integration, http-integration]
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: Verify annotated release tag signature
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ref_json="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${GITHUB_REF_NAME}")"
          tag_type="$(jq -r '.object.type' <<<"${ref_json}")"
          tag_object="$(jq -r '.object.sha' <<<"${ref_json}")"
          if [ "${tag_type}" != "tag" ]; then
            echo "Release tag ${GITHUB_REF_NAME} must be an annotated, signed tag."
            exit 1
          fi
          tag_json="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${tag_object}")"
          verified="$(jq -r '.verification.verified' <<<"${tag_json}")"
          reason="$(jq -r '.verification.reason' <<<"${tag_json}")"
          if [ "${verified}" != "true" ]; then
            echo "Release tag ${GITHUB_REF_NAME} is not verified by GitHub: ${reason}."
            exit 1
          fi
          signed_name="$(jq -r '.tag' <<<"${tag_json}")"
          target_type="$(jq -r '.object.type' <<<"${tag_json}")"
          target_sha="$(jq -r '.object.sha' <<<"${tag_json}")"
          checkout_sha="$(git rev-parse HEAD)"
          if [ "${signed_name}" != "${GITHUB_REF_NAME}" ]; then
            echo "Signed tag name ${signed_name} does not match release ref ${GITHUB_REF_NAME}."
            exit 1
          fi
          if [ "${target_type}" != "commit" ] || [ "${target_sha}" != "${GITHUB_SHA}" ] || [ "${target_sha}" != "${checkout_sha}" ]; then
            echo "Signed tag target ${target_type}:${target_sha} does not match checked-out release commit ${checkout_sha}."
            exit 1
          fi
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      - run: npx --yes npm@11.6.2 audit --audit-level=high
      - run: npm run check
      - run: npm run pack:dry-run
      - name: Configure npm token fallback
        run: |
          if [ -n "${NPM_TOKEN:-}" ]; then
            echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc
            echo "Using NPM_TOKEN secret for npm publish."
          else
            echo "::notice::NPM_TOKEN is not configured. Attempting npm trusted publishing via GitHub OIDC."
            echo "::notice::OIDC publish requires the package to already exist on npm with this workflow configured as a trusted publisher."
          fi
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      - run: npm publish --provenance --access public
  release:
    name: create GitHub release
    needs: npm
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3
        with:
          generate_release_notes: true
