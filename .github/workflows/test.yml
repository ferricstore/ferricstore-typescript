name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  core-routing-parity:
    name: pinned core routing parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          repository: ferricstore/ferricstore
          ref: 7ccc4efadbb0e30bbbb5bcce3761b8d6859b7e9f
          path: ferricstore-core
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22.22.0
          cache: npm
      - run: npm ci
      - run: >-
          npx vitest run
          tests/core-routing-parity.test.ts
          tests/core-native-abi-parity.test.ts
        env:
          FERRICSTORE_CORE_DIR: ${{ github.workspace }}/ferricstore-core
          FERRICSTORE_CORE_REQUIRED: "1"

  unit:
    name: unit node-${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.22.0, 24.x, 26.x]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run check

  package:
    name: package dry-run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22.22.0
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run pack:dry-run

  integration:
    name: integration node-${{ matrix.node-version }} ${{ matrix.server }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - node-version: 22.22.0
            server: release-0.7.5
            image: ghcr.io/ferricstore/ferricstore:0.7.5@sha256:423e498ecb76e986da51fb1675c215f317e1e38bcaa6b66274bbe65207e45311
          - node-version: 24.x
            server: release-0.7.5
            image: ghcr.io/ferricstore/ferricstore:0.7.5@sha256:423e498ecb76e986da51fb1675c215f317e1e38bcaa6b66274bbe65207e45311
          - node-version: 22.22.0
            server: pinned-core
            image: ghcr.io/ferricstore/ferricstore:ci-7ccc4efadbb0e30bbbb5bcce3761b8d6859b7e9f@sha256:7298c8d00045d2e5dfca051fd45fecb7c1ad75fa8d13e82f769c6f67837ad7be
    env:
      FERRICSTORE_IMAGE: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run integration:up
      - run: npm run test:integration
      - if: always()
        run: docker compose logs ferricstore
      - if: always()
        run: npm run integration:down
