name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  core-routing-parity:
    name: pinned core routing parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          repository: ferricstore/ferricstore
          ref: 11456cc0e5f099b72aac56ffe6acd8b6f3fd1624
          path: ferricstore-core
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22.22.0
          cache: npm
      - run: npm ci
      - run: >-
          npx vitest run
          tests/core-routing-parity.test.ts
          tests/core-native-abi-parity.test.ts
        env:
          FERRICSTORE_CORE_DIR: ${{ github.workspace }}/ferricstore-core
          FERRICSTORE_CORE_REQUIRED: "1"

  unit:
    name: unit node-${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.22.0, 24.x, 26.x]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run check

  package:
    name: package dry-run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22.22.0
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run pack:dry-run

  integration:
    name: integration node-${{ matrix.node-version }} ${{ matrix.server }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - node-version: 22.22.0
            server: release-0.9.1
            image: ghcr.io/ferricstore/ferricstore:0.9.1@sha256:b0e1c7cadf787800fe15f5eb7c77449e2d52e65df54257e0df8cd5df975b508f
          - node-version: 24.x
            server: release-0.9.1
            image: ghcr.io/ferricstore/ferricstore:0.9.1@sha256:b0e1c7cadf787800fe15f5eb7c77449e2d52e65df54257e0df8cd5df975b508f
          - node-version: 22.22.0
            server: pinned-core
            image: ghcr.io/ferricstore/ferricstore:ci-11456cc0e5f099b72aac56ffe6acd8b6f3fd1624@sha256:a44941a07f62e35da5814c5183c6e8e1657833d54beb6d6a16bc3d5004bc7ce7
    env:
      FERRICSTORE_IMAGE: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run test:integration:isolated
      - if: always()
        run: npm run integration:down
