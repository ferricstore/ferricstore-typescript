name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  core-routing-parity:
    name: pinned core routing parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          repository: ferricstore/ferricstore
          ref: dc12cff4a916496a7c56e2f3421c9a13bd3dcd8d
          path: ferricstore-core
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22.22.0
          cache: npm
      - run: npm ci
      - run: >-
          npx vitest run
          tests/core-routing-parity.test.ts
          tests/core-native-abi-parity.test.ts
        env:
          FERRICSTORE_CORE_DIR: ${{ github.workspace }}/ferricstore-core
          FERRICSTORE_CORE_REQUIRED: "1"

  unit:
    name: unit node-${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.22.0, 24.x, 26.x]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run check

  package:
    name: package dry-run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22.22.0
          cache: npm
      - run: npm ci
      - run: npx --yes npm@11.6.2 audit --audit-level=high
      - run: npm run build
      - run: npm run pack:dry-run

  integration:
    name: integration node-${{ matrix.node-version }} ${{ matrix.server }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - node-version: 22.22.0
            server: release-0.11.1
            image: ghcr.io/ferricstore/ferricstore:0.11.1@sha256:0439899e853741a098854b510f8db153b73a4afedc13da256ee5643c838bc8f2
          - node-version: 24.x
            server: release-0.11.1
            image: ghcr.io/ferricstore/ferricstore:0.11.1@sha256:0439899e853741a098854b510f8db153b73a4afedc13da256ee5643c838bc8f2
          - node-version: 22.22.0
            server: pinned-core
            image: ghcr.io/ferricstore/ferricstore:ci-dc12cff4a916496a7c56e2f3421c9a13bd3dcd8d@sha256:6e18ef6d869358b0bb03997858450e36ead565f7e9a31042740f38bcc7b3a03d
    env:
      FERRICSTORE_IMAGE: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run test:integration:isolated
      - name: Build SDK for throughput smoke
        if: ${{ matrix.server == 'release-0.11.1' && matrix.node-version == '22.22.0' }}
        run: npm run build
      - name: Start release server for throughput smoke
        if: ${{ matrix.server == 'release-0.11.1' && matrix.node-version == '22.22.0' }}
        run: npm run integration:up
      - name: Acknowledged response throughput smoke
        if: ${{ matrix.server == 'release-0.11.1' && matrix.node-version == '22.22.0' }}
        run: >-
          npm run bench:kv -- --command set --request-mode direct
          --requests 1000 --pipeline 1 --clients 4 --inflight-batches 8
          --value-bytes 32 --min-throughput 100
      - if: always()
        run: npm run integration:down

  authenticated-integration:
    name: authenticated query ACL integration
    runs-on: ubuntu-latest
    env:
      FERRICSTORE_IMAGE: ghcr.io/ferricstore/ferricstore:0.11.1@sha256:0439899e853741a098854b510f8db153b73a4afedc13da256ee5643c838bc8f2
      FERRICSTORE_AUTH_PASSWORD: ts-sdk-integration-secret
      FERRICSTORE_AUTH_URL: ferric://default:ts-sdk-integration-secret@127.0.0.1:6388
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22.22.0
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run integration:up
      - run: node scripts/bootstrap-integration-auth.mjs
        env:
          FERRICSTORE_AUTH_BOOTSTRAP_URL: ferric://127.0.0.1:6388
      - run: npm run test:integration:deployment
      - if: always()
        run: npm run integration:down
