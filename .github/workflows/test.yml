name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  core-routing-parity:
    name: pinned core routing parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          repository: ferricstore/ferricstore
          ref: 70d77b3cdb4e5b2ddd4500d85c7a234cf19de4da
          path: ferricstore-core
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22.22.0
          cache: npm
      - run: npm ci
      - run: >-
          npx vitest run
          tests/core-routing-parity.test.ts
          tests/core-native-abi-parity.test.ts
        env:
          FERRICSTORE_CORE_DIR: ${{ github.workspace }}/ferricstore-core
          FERRICSTORE_CORE_REQUIRED: "1"

  unit:
    name: unit node-${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.22.0, 24.x, 26.x]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run check

  package:
    name: package dry-run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22.22.0
          cache: npm
      - run: npm ci
      - run: npx --yes npm@11.6.2 audit --audit-level=high
      - run: npm run build
      - run: npm run pack:dry-run

  integration:
    name: integration node-${{ matrix.node-version }} ${{ matrix.server }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - node-version: 22.22.0
            server: release-0.11.4
            image: ghcr.io/ferricstore/ferricstore:0.11.4@sha256:ee49d39e3b15cd6298537a88818647e71bcfc7571921e88bcf3a201311c690fc
          - node-version: 24.x
            server: release-0.11.4
            image: ghcr.io/ferricstore/ferricstore:0.11.4@sha256:ee49d39e3b15cd6298537a88818647e71bcfc7571921e88bcf3a201311c690fc
          - node-version: 22.22.0
            server: pinned-core
            image: ghcr.io/ferricstore/ferricstore:ci-70d77b3cdb4e5b2ddd4500d85c7a234cf19de4da@sha256:febb2271a24dcf5dc044d366d037b1e2c175796ed1eb3e836ccd2df31c954033
    env:
      FERRICSTORE_IMAGE: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run test:integration:isolated
      - name: Build SDK for throughput smoke
        if: ${{ matrix.server == 'release-0.11.4' && matrix.node-version == '22.22.0' }}
        run: npm run build
      - name: Start release server for throughput smoke
        if: ${{ matrix.server == 'release-0.11.4' && matrix.node-version == '22.22.0' }}
        run: npm run integration:up
      - name: Acknowledged response throughput smoke
        if: ${{ matrix.server == 'release-0.11.4' && matrix.node-version == '22.22.0' }}
        run: >-
          npm run bench:kv -- --command set --request-mode direct
          --requests 1000 --pipeline 1 --clients 4 --inflight-batches 8
          --value-bytes 32 --min-throughput 100
      - if: always()
        run: npm run integration:down

  authenticated-integration:
    name: authenticated query ACL integration
    runs-on: ubuntu-latest
    env:
      FERRICSTORE_IMAGE: ghcr.io/ferricstore/ferricstore:0.11.4@sha256:ee49d39e3b15cd6298537a88818647e71bcfc7571921e88bcf3a201311c690fc
      FERRICSTORE_AUTH_PASSWORD: ts-sdk-integration-secret
      FERRICSTORE_AUTH_URL: ferric://default:ts-sdk-integration-secret@127.0.0.1:6388
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22.22.0
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run integration:up
      - run: node scripts/bootstrap-integration-auth.mjs
        env:
          FERRICSTORE_AUTH_BOOTSTRAP_URL: ferric://127.0.0.1:6388
      - run: npm run test:integration:deployment
      - if: always()
        run: npm run integration:down
